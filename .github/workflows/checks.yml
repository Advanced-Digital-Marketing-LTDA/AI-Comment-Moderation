name: Verify source-only guide
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_RELEASE: 'false'
      SITE_URL: https://aicommentmoderation.com
      SITE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install -g npm@11.9.0
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:fault
      - run: npm run build
      - run: npm run test:dom
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH=$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -1) npm run test:e2e
      - name: Retain synthetic browser diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            evidence/desktop.png
            evidence/mobile.png
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Build isolated preview image
        run: docker build --build-arg SITE_URL=https://aicommentmoderation.com --build-arg SITE_RELEASE=false --build-arg SITE_COMMIT="$SITE_COMMIT" -t aicommentmoderation:ci .
      - name: Verify container health and Node HTTP contracts
        run: |
          docker run -d --name aicm-smoke --health-interval=2s --health-start-period=1s -p 127.0.0.1:8080:8080 aicommentmoderation:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' aicm-smoke)
            if [ "$status" = healthy ]; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' aicm-smoke)" = healthy
          node scripts/smoke-host.mjs http://127.0.0.1:8080 "$SITE_COMMIT"
      - name: Preserve container diagnostics
        if: failure()
        run: docker logs aicm-smoke || true
      - name: Remove isolated container
        if: always()
        run: docker rm -f aicm-smoke || true
